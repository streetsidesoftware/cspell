---
packages:
  - '@internal/*'
  - 'packages/*'
  - 'packages/*/scripts'
  - 'packages/*/example-code'
  - 'packages/cspell-eslint-plugin/fixtures/dictionaries'
  - 'packages/cspell-eslint-plugin/fixtures/import-support'
  - 'packages/cspell-eslint-plugin/fixtures/issue-8261'
  - 'packages/cspell-eslint-plugin/fixtures/simple'
  - 'rfc/*'
  - 'rfc/drafts/*'
  - 'test-fixtures/dictionaries/*'
  - 'test-fixtures/issues/issue-5034'
  - 'test-fixtures/issues/issue-5034/frontend'
  - 'test-packages'
  - 'test-packages/*/*'
  - 'test-packages/*/*/bin'
  - 'test-packages/*/*/source'
  - 'test-packages/yarn'
  - 'tools/*'
  - 'fixtures/Samples'
  - examples/*
  - integration-tests
  - scripts
  - website
  - website/_scripts

overrides:
  'webpackbar@=6.0.1': '^7.0.0'
  '@isaacs/brace-expansion@=5.0.0': '^5.0.1'
  'diff@=7.0.0': '^8.0.3'

minimumReleaseAgeExclude:
  - '@cspell/dict-cpp@7.1.0'
  - '@cspell/dict-en-common-misspellings@2.2.0'
  - '@cspell/dict-monkeyc@1.1.0'
  - '@cspell/dict-npm@5.2.45'
  - '@cspell/dict-python@4.3.0'
  - '@cspell/dict-software-terms@5.3.0'

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': true
  core-js: false
  esbuild: true
  skia-canvas: false
  unrs-resolver: true

# cspell:dictionaries npm
# cspell:ignore webpackbar unrs
