name: Update Readme files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    env:
      NEW_BRANCH: 'update-readme'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup and Build
        uses: ./.github/actions/install-build
        with:
          node-version: '24.x'

      - name: Update Contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm update-contributors "$GITHUB_TOKEN"

      - name: Build Readme
        run: |
          pnpm run build:readme

      - name: PR Body
        id: pr-body
        uses: streetsidesoftware/actions/public/pr-body@v1
        with:
          title: 'Update README.md'
          path: README.md

      - name: Show PR in Summary
        uses: streetsidesoftware/actions/public/summary@v1
        with:
          text: |
            ${{ steps.pr-body.outputs.body }}

      - name: Create PR
        if: github.ref_name == 'main'
        uses: ./.github/actions/pr
        with:
          commit-message: 'chore: ${{ steps.pr-body.outputs.title }}'
          branch: update-readme
          base: main
          title: 'chore: ${{ steps.pr-body.outputs.title }}'
          body: ${{ steps.pr-body.outputs.body }}
          app_id: ${{ secrets.AUTOMATION_APP_ID }}
          app_private_key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
