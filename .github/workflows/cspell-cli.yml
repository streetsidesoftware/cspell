name: cSpell-cli
on:
  pull_request:
  push:
    branches:
      - main
  # Run on demand
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and Pnpm
        uses: ./.github/actions/setup-node

      - # It is necessary to run `pnpm i` in order install some dictionaries.
        name: prepare-cspell-action
        run: pnpm i

      - name: cspell@latest
        # The excluded configs import `cspell`, which would need a build.
        run: >-
          npx cspell@latest --no-progress --report=typos
          --exclude="yarn2"
          --exclude="examples/mjs-config/**"
          --exclude="test-packages/cspell/test-cspell-cli/fixtures/CommonTS/**"
          "**"
