name: cSpell-cli
on:
  pull_request:
  push:
    branches:
      - main
  # Run on demand
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and Pnpm
        uses: ./.github/actions/setup-node

      - # It is necessary to run `pnpm i` in order install some dictionaries.
        name: prepare-cspell-action
        run: pnpm i

      - # cspell validates each cache entry itself, so the key only needs to pick the newest cache.
        name: Restore CSpell cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cspell-cache-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cspellcache
          restore-keys: |
            cspell-cache-v3-${{ runner.os }}-

      - name: cspell@latest
        # The excluded configs import `cspell`, which would need a build.
        run: >-
          npx cspell@latest --no-progress
          --cache --cache-strategy=content --cache-location=.cspellcache
          --exclude="yarn2"
          --exclude="examples/mjs-config/**"
          --exclude="test-packages/cspell/test-cspell-cli/fixtures/CommonTS/**"
          "**"

      - name: Save CSpell cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cspell-cache-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cspellcache
