name: ' 🚀 Publish: 2. Publish to NPM (automatic)'

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      PUBLISH_NPM:
        required: true
  push:
    tags:
      - 'v*' # publish when a version tag is created

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup and Build
        uses: ./.github/actions/install-build

      - name: Update Sponsor for NPM
        # https://npmjs.com does not support image links the same way GitHub does.
        # This step updates the sponsor information for the NPM package so the sponsor cards
        # will show correctly on the NPM package page.
        run: |
          pnpm run publish:fix:sponsor

      - name: Commit Sponsor Changes
        # lerna publish refuses to run on a dirty working tree. This commit is never
        # pushed, so the changes reach the NPM packages but not the repository.
        run: |
          git config user.name streetsidesoftware[bot]
          git config user.email streetsidesoftware[bot]@users.noreply.github.com
          git commit -am "Update sponsor for NPM"

      - name: Version
        id: version
        run: |
          echo "VERSION=$(jq .version lerna.json)" >> $GITHUB_OUTPUT

      - name: DIST_TAG
        id: dist_tag
        uses: streetsidesoftware/actions/public/output@v1
        with:
          value: ${{ contains(steps.version.outputs.VERSION, 'alpha') && '--dist-tag next' || '' }}

      # See: https://github.com/lerna/lerna/tree/main/commands/publish#bump-from-package
      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{secrets.PUBLISH_NPM}}
          NPM_CONFIG_PROVENANCE: true
          DIST_TAG: ${{ steps.dist_tag.outputs.value }}
        # --git-head: record the commit in the repository, not the sponsor commit, which
        # is lost when this job ends.
        run: |
          pnpm lerna publish from-package --no-push --no-private --yes --git-head "$GITHUB_SHA" $DIST_TAG

      - name: Summary
        uses: streetsidesoftware/actions/public/summary@v1
        with:
          text: |
            # Publish Results
            - Version: ${{ steps.version.outputs.VERSION }}
            - Dist Tag: `${{ steps.dist_tag.outputs.value }}`
