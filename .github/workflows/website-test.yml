name: Website - Build and Test

on:
  pull_request:
    paths:
      - '.github/workflows/website-test.yml'
      - 'static/**'
      - 'website/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/website-test.yml'
      - 'static/**'
      - 'website/**'
  # Run on demand
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: 'lts/*'

      - name: Build
        run: pnpm build

      # Ensure the repository is clean after the build. Updating the READMEs below can change them.
      - run: git --no-pager diff --compact-summary --exit-code

      # The website includes some READMEs. Inject the blocks from `static/` into them,
      # as Update README does after a merge.
      - name: Update the READMEs
        run: pnpm run build:readme

      - name: Build website
        working-directory: website
        run: pnpm run build:site
