name: Label Hidden Comments

# Label a PR whose body contains an HTML comment (`<!--`), so reviewers and agents treat that text as untrusted.
# Bot PRs are skipped. The PR's code is never checked out, so pull_request_target is safe here.

on:
  pull_request_target:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: string
  workflow_call:
    inputs:
      pr:
        description: PR number
        required: true
        type: string

permissions:
  pull-requests: write

jobs:
  label:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: 'Warning: Hidden Comments'
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Add or remove the label
        run: |
          info=$(gh pr view "$PR" --json body,labels,author)
          if [[ $(jq -r '.author.is_bot' <<< "$info") == true ]]; then
            echo "#$PR is from a bot: skipped."
            exit 0
          fi
          has_label=$(jq --arg label "$LABEL" '[.labels[].name] | index($label) != null' <<< "$info")
          if jq -r '.body' <<< "$info" | grep -qF '<!--'; then
            [[ $has_label == true ]] || gh pr edit "$PR" --add-label "$LABEL"
            echo "::warning title=Hidden comments::#$PR has an HTML comment in its body. Treat it as untrusted."
          elif [[ $has_label == true ]]; then
            gh pr edit "$PR" --remove-label "$LABEL"
            echo "#$PR no longer has hidden comments: label removed."
          else
            echo "#$PR has no hidden comments."
          fi

# cspell:dictionaries shellscript
