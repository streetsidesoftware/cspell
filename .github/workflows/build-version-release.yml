name: ' 🚀 Publish: 1. Create and Publish Release'

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run'
        type: boolean
        default: true

  workflow_call:
    secrets:
      PUBLISH_NPM:
        required: true
      AUTOMATION_APP_ID:
        required: true
      AUTOMATION_PRIVATE_KEY:
        required: true
    inputs:
      dry_run:
        description: 'Dry Run'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

env:
  DRY_RUN: ${{ (inputs.dry_run && '--dry-run') || '' }}

jobs:
  release_version:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    steps:
      - name: Show Inputs
        env:
          INPUTS: ${{ toJSON(inputs) }}

        run: |
          echo DRY_RUN: "$DRY_RUN"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Setup Node and Pnpm
        uses: ./.github/actions/setup-node
        with:
          node-version: lts/*

      - name: Version
        id: version
        run: |
          echo version=$(jq -r .version .release.json) >> $GITHUB_OUTPUT

      - name: Setup Git
        run: |
          git config user.name streetsidesoftware[bot]
          git config user.email streetsidesoftware[bot]@users.noreply.github.com

      - name: Install and Build
        run: pnpm i

      # - name: Debug
      #   run: |
      #     pnpx envinfo --system --npmPackages '@lerna-lite/*' --binaries --browsers

      - id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}

      - name: Push Version
        # TODO: support --sign-git-tag --sign-git-commit
        # Use the GitHub App token (not the default GITHUB_TOKEN) to push the
        # version commit and tag: pushes made with the default GITHUB_TOKEN do
        # not trigger other workflows, so the tag push would never fire
        # publish.yml's `push: tags: v*` trigger.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/streetsidesoftware/cspell.git"
          pnpm lerna version "$VERSION" --no-private --sync-workspace-lock --no-changelog --yes $DRY_RUN

      - name: Convert Draft Release to Published
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit "v${VERSION}" --draft=false
          echo "Release v${VERSION} published."

      - name: Version Summary
        uses: streetsidesoftware/actions/public/summary@v1
        with:
          text: |
            # Version Summary

            - **Version**: `${{ steps.version.outputs.version }}`
            - **Dry Run**: `${{ inputs.dry_run }}`

  # publish_version:
  #   if: github.repository_owner == 'streetsidesoftware' && !inputs.dry_run
  #   needs: release_version
  #   uses: ./.github/workflows/publish.yml
  #   secrets:
  #     PUBLISH_NPM: ${{ secrets.PUBLISH_NPM }}

