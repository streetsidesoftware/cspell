name: ' 🔗 Update PNPM'

on:
  workflow_dispatch:
    inputs:
      base:
        description: The Base Ref to apply the diff
        required: false
        default: 'main'

  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

jobs:
  update-pnpm:
    if: github.repository_owner == 'streetsidesoftware'
    uses: streetsidesoftware/actions/.github/workflows/update-pnpm.yml@v1
    with:
      base: ${{ inputs.base || 'main' }}
    secrets: inherit
