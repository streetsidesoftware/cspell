name: ' 🔗 Update PNPM'

on:
  workflow_dispatch:
    inputs:
      base:
        description: The Base Ref to apply the diff
        required: false
        default: 'main'

  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

jobs:
  update-pnpm:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    env:
      NEW_BRANCH: update-pnpm-${{ inputs.base || 'main' }}
      REF_BRANCH: ${{ inputs.base || 'main' }}
      PR_TYPE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF_BRANCH }}

      - name: Setup
        uses: ./.github/actions/setup-pnpm

      - name: Update PNPM
        # Updates `packageManager` in `package.json` to the newest pnpm that is old enough.
        # `self-update` ignores `minimumReleaseAge` in `pnpm-workspace.yaml`, so set it here to match.
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: 2880 # two days
        run: |
          pnpm self-update

      - name: Gen Body
        id: git-body
        uses: streetsidesoftware/actions/public/pr-body@v1
        with:
          title: Update ALL Dependencies ${{ env.REF_BRANCH }}
          path: package.json

      - name: PR
        uses: ./.github/actions/pr
        with:
          commit-message: 'ci: Workflow Bot -- Update PNPM'
          branch: ${{ env.NEW_BRANCH }}
          base: ${{ env.REF_BRANCH }}
          title: 'ci: Workflow Bot -- Update PNPM (${{ env.REF_BRANCH }})'
          body: ${{ steps.git-body.outputs.body }}
          app_id: ${{ secrets.AUTOMATION_APP_ID }}
          app_private_key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}

      - name: Summary
        uses: streetsidesoftware/actions/public/summary@v1
        with:
          text: ${{ steps.git-body.outputs.body }}
