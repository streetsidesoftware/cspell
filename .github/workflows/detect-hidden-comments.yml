name: Detect Hidden Comments

# Detect an HTML comment in a PR description, label the PR, and fail the check, so reviewers and agents treat the
# hidden text as untrusted and it doesn't reach the release notes. Bot PRs are skipped.
# Detection is scripts/detect-html-comments.mts, run from the base branch: the PR's code is never checked out, so
# pull_request_target is safe here.

on:
  pull_request_target:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: string

permissions: {}

# One run at a time per PR. Each run reads the PR's current description and labels, so the last run decides.
concurrency:
  group: detect-hidden-comments-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

env:
  LABEL: 'Warning: Hidden Comments'

jobs:
  detect:
    name: Detect
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
      found: ${{ steps.detect.outputs.found }}
      error: ${{ steps.detect.outputs.error }}
      labelled: ${{ steps.detect.outputs.labelled }}
      report: ${{ steps.detect.outputs.report }}
    steps:
      # The base branch, not the PR: pull_request_target checks out the base by default.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The detection script uses only Node's built-in modules, so there's nothing to install and no cache.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.x

      - name: Look for HTML comments in the PR description
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        # Fails closed: if the description can't be read or checked, it's treated as having hidden comments.
        # detect-html-comments.mts exits 0 for none, 2 for found, and 1 (or anything else) for an error.
        run: |
          error=false
          if ! info=$(gh pr view "$PR" --json body,labels,author); then
            error=true
          elif [[ $(jq -r '.author.is_bot' <<< "$info") == true ]]; then
            echo "#$PR is from a bot: skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          report=''
          if [[ $error == false ]] && body=$(jq -r '.body // ""' <<< "$info"); then
            status=0
            report=$(node ./scripts/detect-html-comments.mts <<< "$body") || status=$?
            case $status in
              0) found=false ;;
              2) found=true ;;
              *) error=true ;;
            esac
          else
            error=true
          fi
          if [[ $error == true ]]; then
            found=true
            echo "::warning::Could not check the PR description (see the log above)."
          fi
          labelled=$(jq --arg label "$LABEL" '[.labels[].name] | index($label) != null' <<< "$info" 2> /dev/null) || true
          [[ $labelled == true ]] || labelled=false
          echo "$report"
          echo "#$PR: hidden comments=$found, error=$error, labelled=$labelled"
          delimiter="REPORT_$(openssl rand -hex 16)"
          {
            echo "skip=false"
            echo "found=$found"
            echo "error=$error"
            echo "labelled=$labelled"
            echo "report<<$delimiter"
            echo "$report"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  label:
    name: Update label
    needs: detect
    if: >-
      github.repository_owner == 'streetsidesoftware' &&
      needs.detect.outputs.skip != 'true' &&
      needs.detect.outputs.found != needs.detect.outputs.labelled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Add or remove the label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          FOUND: ${{ needs.detect.outputs.found }}
        run: |
          if [[ $FOUND == true ]]; then
            gh pr edit "$PR" --add-label "$LABEL"
          else
            gh pr edit "$PR" --remove-label "$LABEL"
          fi

  check:
    name: Check
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if the PR description has hidden comments
        env:
          FOUND: ${{ needs.detect.outputs.found }}
          ERROR: ${{ needs.detect.outputs.error }}
          REPORT: ${{ needs.detect.outputs.report }}
        run: |
          if [[ $ERROR == true ]]; then
            echo "::error title=Hidden comments::The hidden comment detector failed, so a maintainer must review the PR description."
            exit 1
          fi
          if [[ $FOUND != true ]]; then
            echo "No hidden comments."
            exit 0
          fi
          msg='The PR description contains an HTML comment (`<!-- ... -->`). Hidden text in a PR description is'
          msg+=' published in the release notes and can mislead reviewers. Remove it, or show it as code in a fenced'
          msg+=' block, and this check reruns when you edit the description.'
          echo "::error title=Hidden comments::$msg"
          echo "$REPORT"
          exit 1

# cspell:dictionaries shellscript
