name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
filter-by-commitish: true
commitish: main
prerelease: false
prerelease-identifier: ''

categories:
  - title: 'Features'
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  - title: '**BREAKING**'
    labels:
      - 'breaking'
  - title: 'Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: 'Dictionary Updates'
    labels:
      - 'Update Dictionaries'
  - title: 'Documentation'
    labels:
      - 'documentation'
      - 'Documentation'
  - title: 'Testing'
    labels:
      - 'test'
  - title: 'Maintenance'
    labels:
      - 'chore'
      - 'dependencies'

change-template: |
  <details>
  <summary>$TITLE (#$NUMBER)</summary>

  ### $TITLE (#$NUMBER)
  $BODY

  ---

  </details>

change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  major:
    labels:
      - major
      - breaking
  minor:
    labels:
      - minor
      - feature
  patch:
    labels:
      - patch
  default: patch
exclude-labels:
  - hide-from-release
  - cspell5
  - chore
  - dependencies
  - test
  - refactor
include-labels:
  - breaking
  - documentation
  - feat
  - feature
  - fix
  - Update Dictionaries
autolabeler:
  - label: 'Update Dictionaries'
    title:
      - '/Update Dictionaries/i'
  - label: 'dependencies'
    title:
      - '/^ci: Workflow Bot.*Dependencies/i'
  - label: 'chore'
    title:
      - '/^chore/i'
      - '/^ci[:](?! Workflow Bot)/i'
      - '/^ci[:(]?/i'
  - label: 'documentation'
    files:
      - '/website/**/*.md'
    title:
      - '/^docs?/i'
  - label: 'fix'
    title:
      - '/^fix/i'
      # A revert is published only if the change it undoes was.
      - '/^revert(?::\s*|\s+")(feat|fix|docs?)(\([^)]*\))?!?:/i'
  - label: 'refactor'
    title:
      # Not `!:`: a breaking refactor is published.
      - '/^dev(\([^)]*\))?:/i'
      - '/^refactor(\([^)]*\))?:/i'
  - label: 'feature'
    title:
      - '/^feat/i'
  - label: 'test'
    title:
      - '/^test/i'
  - label: 'breaking'
    title:
      - '/^[a-z]+(\([^)]*\))?!:/i'
  - label: cspell5
    branch:
      - '/cspell5/i'

template: |
  $CHANGES

# Applied to the whole release body, which also feeds the CHANGELOG.md files.
# Tested by scripts/check-release-drafter.mts.
# Tool attribution, each only on a line of its own:
replacers:
  # A `---` line directly above a "_Generated by [Tool](...)_" line.
  - search: |-
      /^[ \t]*-{3,}[ \t]*\r?\n(?=[ \t]*_Generated by \[)/gim
    replace: ''
  # "Generated with [Tool](...)" or "_Generated by [Tool](...)_", with an optional emoji.
  - search: |-
      /^[ \t]*(?:\p{Extended_Pictographic}\uFE0F?[ \t]*)?_?Generated (?:with|by) \[[^\]\n]+\]\([^)\s]+\)_?[ \t]*(?:\r?\n|$)/gimu
    replace: ''
  # A Claude Code session link.
  - search: |-
      /^[ \t]*https:\/\/claude\.ai\/code\/session_[A-Za-z0-9]+[ \t]*(?:\r?\n|$)/gim
    replace: ''

# cspell:ignore autolabeler commitish
