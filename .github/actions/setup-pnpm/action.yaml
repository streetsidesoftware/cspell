name: setup_pnpm
description: |
  Install pnpm (the version in `packageManager`) and Node with `pnpm/setup`.
  Node installed this way has no npm, npx, or Corepack.
inputs:
  node-version:
    required: false
    description: The version of Node to use, for example `24.x` or `lts`.
    default: 'lts'
  save-cache:
    required: false
    description: |
      Save the pnpm store to the cache at the end of the job. Set to `false` to only restore it,
      for example in all but one job of a matrix.
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Setup pnpm and Node.js ${{ inputs.node-version }}
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        save-cache: ${{ inputs.save-cache }}
        install: false

    - name: Versions
      run: |
        pnpm -v
        node -v
      shell: bash
